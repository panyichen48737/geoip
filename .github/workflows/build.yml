name: Build geoip files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "*.md"
  # 注意：PR 触发的运行里 `Get GeoLite2` 依赖 MAXMIND_GEOLITE2_LICENSE。Dependabot 发起的 PR
  # 只能读取 Settings → Secrets and variables → Dependabot 中的 secrets，读不到普通 Actions
  # secrets；该处若没有同名 secret，Dependabot PR 的构建会停在这一步。
  pull_request:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "*.md"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Set variables
        run: |
          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> ${GITHUB_ENV}
          echo "games=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/Game.list" >> ${GITHUB_ENV}
          echo "media=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list" >> ${GITHUB_ENV}
          echo "cn1=http://ftp.apnic.net/stats/apnic/delegated-apnic-latest" >> $GITHUB_ENV
          echo "cn_asn=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaASN/ChinaASN.list" >> $GITHUB_ENV
          echo "cn_asn1=https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list" >> $GITHUB_ENV
        shell: bash

     
      - name: Gererate games
        run: |
          mkdir -p ./data/
          curl -fsSL ${games} | perl -ne '/^(IP-CIDR.*),([^,]+),/ && print "$2\n"' > ./data/games

      - name: Gererate media
        run: |
          mkdir -p ./data/
          curl -fsSL ${media} | perl -ne '/^(IP-CIDR.*),([^,]+),/ && print "$2\n"' > ./data/media

      - name: Generate cn and cn_ip
        run: |
          mkdir -p ./ips/
          curl -fsSL ${cn1} | awk -F '|' '/CN/&&/ipv4/ {print $4 "/" 32-log($5)/log(2)}' >> ./data/cn
          curl -fsSL ${cn1} | awk -F '|' '/CN/&&/ipv6/ {print $4 "/" $5}' >> ./data/cn

          

      - name: Get GeoLite2
        env:
          LICENSE_KEY: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
        run: |
          mkdir -p ./output/ ./geolite2/
          curl -fL -u ${LICENSE_KEY} 'https://download.maxmind.com/geoip/databases/GeoLite2-ASN/download?suffix=tar.gz' | tar -zx -C ./
          curl -fL -u ${LICENSE_KEY} 'https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz' | tar -zx -C ./
          curl -fL -u ${LICENSE_KEY} -o ./GeoLite2-ASN-CSV.zip -L 'https://download.maxmind.com/geoip/databases/GeoLite2-ASN-CSV/download?suffix=zip'
          curl -fL -u ${LICENSE_KEY} -o ./GeoLite2-Country-CSV.zip -L 'https://download.maxmind.com/geoip/databases/GeoLite2-Country-CSV/download?suffix=zip'
          unzip ./GeoLite2-ASN-CSV.zip
          unzip ./GeoLite2-Country-CSV.zip
          rm -f ./*.zip
          mv -f ./GeoLite2-Country_*/*.mmdb ./output/
          mv -f ./GeoLite2-ASN_*/*.mmdb ./output/
          mv -f ./GeoLite2-ASN-CSV_*/*.csv ./geolite2/
          mv -f ./GeoLite2-Country-CSV_*/*.csv ./geolite2/

      - name: Build geoip files
        run: |
          go build ./
          ./geoip convert -c ./config.json

      - name: Get geoip-all.dat and Country-all.mmdb relative files
        run: |
          curl -f -o ./output/geoip-all.dat -L https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat
          curl -f -o ./output/Country-all.mmdb -L https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
          curl -f -o ./output/Country-ASN-all.mmdb -L https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-asn.mmdb

      - name: Verify mmdb files
        run: |
          cd ./output/ || exit 1
          go install -v github.com/maxmind/mmdbverify@v1.1.0
          for name in $(ls *.mmdb); do
            $(go env GOPATH)/bin/mmdbverify -file ${name}
          done

      - name: Build db and metadb file
        run: |
          cd ./output/ || exit 1
          go install -trimpath -ldflags="-s -w -buildid=" github.com/metacubex/geo/cmd/geo@master
          for file in $(ls *.dat | sed 's/\..*//'); do
            geo convert ip -i v2ray -o meta -f "./${file}.metadb" "./${file}.dat"
            geo convert ip -i v2ray -o sing -f "./${file}.db" "./${file}.dat"
          done

      - name: Move files
        run: |
          mkdir -p ./mihomo-geodata/ ./sing-box-geodata/
          cd ./output/ || exit 1
          for file in $(ls *.dat *.metadb); do
            install -Dp "./${file}" ../mihomo-geodata/
          done
          for file in $(ls *.db); do
            install -Dp "./${file}" ../sing-box-geodata/
          done

      - name: Move and generate files to branchs
        run: |
          mkdir -p ./tmp/
          mv -f ./output/Country*.mmdb ./mihomo-geodata/
          for file in $(ls ./output/clash/classical/ | sed 's/\..*//'); do
            cat "./output/clash/classical/${file}.txt" | perl -ne '/^\s*-\s+(.*)/ && print "$1\n"' > "./tmp/temp-${file}.list"
            sort --ignore-case "./tmp/temp-${file}.list" > "./ips/${file}ip.list"
          done

          grep '^IP-CIDR' ./ips/cnip.list | cut -d',' -f2 > ./ips/cnip.txt
          grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}' ./ips/cnip.txt | tee ./ips/cnip_ipv4.txt > ./ips/cn_ipv4.txt
          grep -Eio '([a-f0-9]{0,4}:){2,7}[a-f0-9]{0,4}/[0-9]{1,3}' ./ips/cnip.txt | tee ./ips/cnip_ipv6.txt > ./ips/cn_ipv6.txt
          
          cat ./config.json | grep '\"netflix\":' | grep -o 'AS[0-9]\+' | sed 's/^/IP-ASN,/' | sort --ignore-case > ./ips/netflix-asn.list
          cat ./config.json | grep '\"telegram\":' | grep -o 'AS[0-9]\+' | sed 's/^/IP-ASN,/' | sort --ignore-case > ./ips/telegram-asn.list
          # `ASN.China.list` 的行形如 `IP-ASN,4134`，数字后面没有逗号；原先的模式要求
          # 必须跟一个逗号，对它 5076 行全部匹配失败，而它正是本列表里量最大的一份。
          # ChinaASN 的 `IP-ASN,10111,no-resolve` 去掉尾逗号后输出不变。
          # 排序去重必须等两个源都读完：两源重叠 844 条，放在第一个源之后只会把第二份
          # 5076 行原样追加在有序结果尾部。curl 也从没有 pipefail 的管道头部挪了出来——
          # 这是一个 `bash -e` 的默认 shell，管道里失败的 curl 只会静默产出空列表。
          curl -fsSL ${cn_asn} -o ./tmp/cn-asn.list
          curl -fsSL ${cn_asn1} -o ./tmp/cn-asn1.list
          cat ./tmp/cn-asn.list ./tmp/cn-asn1.list | perl -ne '/^(IP-ASN,\d+)/ && print "$1\n"' | sort --ignore-case -u > ./ips/cn-asn.list

          rm -rf ./tmp* ./output*

      - name: Sanity check outputs
        run: |
          status=0
          for f in ./data/games ./data/media ./data/cn ./ips/* ./mihomo-geodata/* ./sing-box-geodata/*; do
            if [ ! -s "${f}" ]; then
              echo "::error::输出为空或缺失：${f}"
              status=1
            fi
          done
          [ "${status}" -eq 0 ] || exit 1
          wc -l ./data/games ./data/media ./data/cn ./ips/*.list
          ls -l ./mihomo-geodata/ ./sing-box-geodata/

          # CN 条目数守卫。只查「非空」拦不住上游源换格式造成的静默缩水（cn-asn 那次
          # 就是：列表里少了 5076 行，构建照样绿），而 cn 缩水的后果是这部分流量改走代理。
          # 拿上一次发布的列表比一比。取不到（首次运行、网络抖动）只警告，不判死构建。
          if curl -fsSL --max-time 60 "https://raw.githubusercontent.com/${{ github.repository }}/ips/cnip.list" -o /tmp/cnip-previous.list; then
            previous=$(wc -l < /tmp/cnip-previous.list)
            current=$(wc -l < ./ips/cnip.list)
            floor=$(( previous * 80 / 100 ))
            echo "cnip.list：上次 ${previous} 行 -> 本次 ${current} 行（下限 ${floor}）"
            if [ "${current}" -lt "${floor}" ]; then
              echo "::error::cnip.list 由 ${previous} 行掉到 ${current} 行，跌幅超过 20%，很可能是某个上游源失效或格式变化"
              exit 1
            fi
          else
            echo "::warning::取不到已发布的 cnip.list，跳过跌幅守卫"
          fi

      - name: Release and upload `ips` assets
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ips
          tag: ips
          overwrite: true
          body: |
            供下游项目 [DustinWin/ruleset_geodata](https://github.com/DustinWin/ruleset_geodata) 使用的 IP 数据源文件
            [ShellCrash](https://github.com/juewuy/ShellCrash) 中 CN_IP 绕过内核所需文件
            文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./ips/*

      - name: Commit and push `ips` branch
        if: github.event_name != 'pull_request'
        run: |
          cd ./ips/ || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b ips
          git add . && git commit -m "IP 数据源文件和 CNIP 绕过内核文件更新于 ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin ips

      - name: Release and upload `mihomo-geodata` assets
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: mihomo-geodata
          tag: mihomo-geodata
          overwrite: true
          body: |
            [mihomo 内核](https://github.com/MetaCubeX/mihomo) geodata 文件
            geodata 文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./mihomo-geodata/*

      - name: Commit and push `mihomo-geodata` branch
        if: github.event_name != 'pull_request'
        run: |
          cd ./mihomo-geodata/ || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b mihomo-geodata
          git add . && git commit -m "mihomo 内核 geodata 文件更新于 ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin mihomo-geodata

      - name: Release and upload `sing-box-geodata` assets
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box-geodata
          tag: sing-box-geodata
          overwrite: true
          body: |
            [sing-box 内核](https://github.com/SagerNet/sing-box) geodata 文件
            geodata 文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./sing-box-geodata/*

      - name: Commit and push `sing-box-geodata` branch
        if: github.event_name != 'pull_request'
        run: |
          cd ./sing-box-geodata/ || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b sing-box-geodata
          git add . && git commit -m "sing-box 内核 geodata 文件更新于 ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin sing-box-geodata

     

      - name: Purge jsDelivr CDN
        if: github.event_name != 'pull_request'
        run: |
          cd ./ips/ || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@ips/${file}"
          done
          cd ../mihomo-geodata/ || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@mihomo-geodata/${file}"
          done
          cd ../sing-box-geodata/ || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@sing-box-geodata/${file}"
          done

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
