name: Build geoip files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "*.md"
  # 注意：PR 触发的运行里 `Get GeoLite2` 依赖 MAXMIND_GEOLITE2_LICENSE。Dependabot 发起的 PR
  # 只能读取 Settings → Secrets and variables → Dependabot 中的 secrets，读不到普通 Actions
  # secrets；该处若没有同名 secret，Dependabot PR 的构建会停在这一步。
  pull_request:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "*.md"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Set variables
        run: |
          echo "update_version=$(date -d '+8 hours' +%Y-%m-%d)" >> ${GITHUB_ENV}
          echo "games=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/Game.list" >> ${GITHUB_ENV}
          echo "media=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list" >> ${GITHUB_ENV}
          echo "cn1=http://ftp.apnic.net/stats/apnic/delegated-apnic-latest" >> $GITHUB_ENV
          echo "cn_asn=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaASN/ChinaASN.list" >> $GITHUB_ENV
          echo "cn_asn1=https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list" >> $GITHUB_ENV
        shell: bash

     
      - name: Generate games
        run: |
          mkdir -p ./data/ ./tmp/
          # 下载和过滤分开写，理由同 `Get GeoLite2` 那步：默认 shell 是 `bash -e` 但没有
          # pipefail，管道退出码取 perl 的，curl 失败被吞掉。`-f` 只管 HTTP 错误状态；
          # 传到一半断流是 exit 18，此时**已写入的那部分留在文件里**，文件非空、非空检查
          # 放行 —— 而 gamesip 只有 46 条，小到没进条目数守卫，丢了没有任何人会知道。
          # 拆开之后再加 `--retry 3`：断流这类瞬时错误 curl 会整个重来一遍，正好补上。
          # `--max-time 300` 是不让它卡死 —— 没有它，连接挂住会一直等到 job 默认的 6 小时。
          # 注意 MaxMind 那三个刻意不加 `--retry`，原因见 `Get GeoLite2` 那步。
          curl -fsSL --retry 3 --max-time 300 ${games} -o ./tmp/games.raw
          perl -ne '/^(IP-CIDR.*),([^,]+),/ && print "$2\n"' ./tmp/games.raw > ./data/games

      - name: Generate media
        run: |
          mkdir -p ./data/ ./tmp/
          # 同上。
          curl -fsSL --retry 3 --max-time 300 ${media} -o ./tmp/media.raw
          perl -ne '/^(IP-CIDR.*),([^,]+),/ && print "$2\n"' ./tmp/media.raw > ./data/media

      - name: Generate cn and cn_ip
        run: |
          mkdir -p ./ips/ ./tmp/
          # 同上：下载与过滤分开。另外原来对**同一个** ${cn1} 调了两次 curl，一次构建把
          # APNIC 那个文件下了两遍，现在只下一次、两次 awk 读同一个文件。
          curl -fsSL --retry 3 --max-time 300 ${cn1} -o ./tmp/apnic.raw
          awk -F '|' '/CN/&&/ipv4/ {print $4 "/" 32-log($5)/log(2)}' ./tmp/apnic.raw >> ./data/cn
          awk -F '|' '/CN/&&/ipv6/ {print $4 "/" $5}' ./tmp/apnic.raw >> ./data/cn

          

      - name: Get GeoLite2
        env:
          LICENSE_KEY: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
        run: |
          mkdir -p ./output/ ./geolite2/
          # 不再下载 `GeoLite2-ASN` 的 mmdb：它下来没人用。config.json 里 `sourceMMDBURI` 只出现
          # 两次、都是 Country.mmdb；插件源码里硬编码的 GeoLite2 路径只有 Country.mmdb 和五个 CSV；
          # 两个 geodata 分支的产物清单里也没有 GeoLite2-*.mmdb。`Country-ASN.mmdb` 的 ASN 取自下面
          # 的 ASN CSV，不是这个 mmdb。省掉它之后每次构建只耗 3 次 MaxMind 下载，而账号额度是
          # 24 小时 30 次 —— 24 小时内的构建上限从 7 次提到 10 次。
          # 下载和 `tar` 分开写：这是一个 `bash -e` 但没有 pipefail 的默认 shell，写成
          # `curl ... | tar -zx` 时管道的退出码取 tar 的，429 之类会以
          # `gzip: stdin: unexpected end of file` / `tar: Child returned status 1` 的形式出现，
          # 真正的原因（`curl: (22) ... 429`）被淹在中间。拆开后能直接拿到 curl 的状态码 ——
          # 下面正是靠它区分 429。
          # 这三处刻意**不加** `--retry`，与文件里其他 curl 不同：curl 手册写明 `--retry` 会
          # 重试 HTTP 429（"an HTTP 408, 429, 500, ..."），而 MaxMind 的额度用尽正是 429，
          # 且其文档说失败请求过多会触发限流 —— 重试只会越锁越死。
          # `--max-time 300` 与额度无关（超时同样是已经发出去的一次请求，额度和挂住 6 小时
          # 一样，但至少不拖住整个 job）。
          #
          # 429（额度用尽）时回落到 Loyalsoldier 的 release 镜像：那上面放的就是同一批 MaxMind
          # 文件、连带日期的目录名都一样，所以回落不影响后面那些 `mv ./GeoLite2-*_*/*`。
          # **只在 429 回落**：401/403 是密钥配错（PR 触发时 Dependabot secrets 是空的，会走到
          # 这里）、5xx/`000` 是对方或网络故障 —— 这些该红就红，拿一份一周前的数据盖过去只会
          # 把问题藏起来。
          # 不用 `-f` 也是为此：`-f` 只给一个笼统的退出码 22，拿不到 429 和 403 的区别。
          # 连接失败时 `%{http_code}` 是 `000`（实测）。
          mirror=https://raw.githubusercontent.com/Loyalsoldier/geoip/refs/heads/release
          use_mirror=0
          for spec in 'GeoLite2-Country.tar.gz:GeoLite2-Country:tar.gz' \
                      'GeoLite2-ASN-CSV.zip:GeoLite2-ASN-CSV:zip' \
                      'GeoLite2-Country-CSV.zip:GeoLite2-Country-CSV:zip'; do
            file=${spec%%:*}
            rest=${spec#*:}
            edition=${rest%%:*}
            suffix=${rest##*:}
            code=$(curl -L --max-time 300 -u "${LICENSE_KEY}" -w '%{http_code}' -o "./${file}" \
                     "https://download.maxmind.com/geoip/databases/${edition}/download?suffix=${suffix}" || true)
            case "${code}" in
              200) echo "MaxMind：${file} 已下载" ;;
              429) echo "::warning::MaxMind 配额用尽（429），三份输入改从 release 镜像取"
                   use_mirror=1
                   break ;;
              *)   echo "::error::MaxMind 下载 ${file} 失败，HTTP ${code}（只有 429 才回落镜像）"
                   exit 1 ;;
            esac
          done
          if [ "${use_mirror}" = "1" ]; then
            # 三份一起换，不做单份回落：额度是账号级的，中途用尽时前面那份已经下来了，混着用
            # 会静默产出「今天的 mmdb + 一周前的 CSV」。逐份日期不同本来就是常态，而且不是
            # 镜像的特征 —— 那是 MaxMind 自己的快照节奏：2026-10-02 那次三份全走 MaxMind，
            # 解出来照样是 09-29 / 10-02 / 09-29，镜像只是照抄它下到的那一批。所以这里不比
            # 日期差多少，只要求整组同源。
            for file in GeoLite2-Country.tar.gz GeoLite2-ASN-CSV.zip GeoLite2-Country-CSV.zip; do
              curl -fL --retry 3 --max-time 300 -o "./${file}" "${mirror}/${file}"
            done
          fi
          tar -zxf ./GeoLite2-Country.tar.gz -C ./
          unzip ./GeoLite2-ASN-CSV.zip
          unzip ./GeoLite2-Country-CSV.zip
          rm -f ./*.zip ./*.tar.gz
          # 快照日期取自解出来的目录名（`GeoLite2-Country_20260929/`），不用额外发请求。
          # 它是「这份数据到底多旧」的唯一凭据 —— 逐份不同是常态，看单份没意义，看整组。
          cutoff=$(date -u -d '7 days ago' +%Y%m%d)
          for dir in ./GeoLite2-Country_* ./GeoLite2-ASN-CSV_* ./GeoLite2-Country-CSV_*; do
            stamp=${dir##*_}
            echo "输入快照：$(basename "${dir}")"
            if [ "${stamp}" -lt "${cutoff}" ]; then
              echo "::warning::$(basename "${dir}") 的快照日期 ${stamp} 已超过 7 天（要么 MaxMind 自己没重建，要么回落时镜像没在重建）"
            fi
          done
          mv -f ./GeoLite2-Country_*/*.mmdb ./output/
          mv -f ./GeoLite2-ASN-CSV_*/*.csv ./geolite2/
          mv -f ./GeoLite2-Country-CSV_*/*.csv ./geolite2/

      - name: Build geoip files
        run: |
          go build ./
          ./geoip convert -c ./config.json

      - name: Get geoip-all.dat and Country-all.mmdb relative files
        run: |
          # `--retry 3` 在这里同样无害（注意不是 MaxMind 那三个，见 `Get GeoLite2` 那步）；
          # raw.githubusercontent 是 CDN，断流重来一次基本就好。`--max-time 300` 防卡死。
          curl -f --retry 3 --max-time 300 -o ./output/geoip-all.dat -L https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat
          curl -f --retry 3 --max-time 300 -o ./output/Country-all.mmdb -L https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
          curl -f --retry 3 --max-time 300 -o ./output/Country-ASN-all.mmdb -L https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-asn.mmdb

          # 新鲜度守卫。这三个文件取自 Loyalsoldier 的 release 分支，那个分支由上游的**周四
          # 定时构建**刷新（build.yml 里 `cron: "0 0 * * 4"`，UTC），不是按需触发：schedule
          # 事件的 run 每周四都有，09-24 / 09-17 / 09-10 / 09-03 / 08-27 全绿。但这个定时
          # 既不保证准点也不保证不漏 —— 08-27 那次迟了 7 小时 41 分，2026-10-01 那个周四
          # 干脆没跑（最后一条 schedule 停在 09-24，当天 release 是被 15:00 的手动 dispatch
          # 补刷的）。所以它一旦安静下来，我们这边毫无信号：文件照下、构建照绿、产物是旧的。
          # mmdb 尾部元数据自带 build_epoch（生成时刻），读出来比一比就知道上游那份数据
          # 有多旧。
          # 只警告不判死：输入变旧是「该看一眼」，判死会因为一个上游镜像停滞，把其他本来
          # 新鲜的产物一起挡住不发。geoip-all.dat 是 v2ray 格式、不内嵌时间戳，守不了 ——
          # 三个文件由上游同一次重建产出，两个 mmdb 新鲜基本说明它也新鲜。
          now=$(date +%s)
          for name in Country-all.mmdb Country-ASN-all.mmdb; do
            # build_epoch 键后面是控制字节 + 4 字节大端值，控制字节实测是 `0402`。
            # 这个形状是从样本归纳的、不是从格式规范推的，所以编码不符就当作读不懂：
            # 宁可漏报，也别拿一个读歪的数字去比。
            # `|| true`：读失败（文件缺、格式变）时别让 `-e` 把整个步骤带走 —— 那就成了
            # fail-close，与「只警告」的意图相反。
            epoch=$(perl -0777 -ne '
              my $i = rindex($_, "\xab\xcd\xef"."MaxMind.com");
              my $blk = $i < 0 ? "" : substr($_, $i + 14);
              my $k = index($blk, "build_epoch");
              print unpack("N", substr($blk, $k + 13, 4))
                if $i >= 0 && $k >= 0 && unpack("H*", substr($blk, $k + 11, 2)) eq "0402";
            ' "./output/${name}" 2>/dev/null) || true
            if [ -z "${epoch}" ]; then
              echo "::warning::读不出 ${name} 的 build_epoch，跳过新鲜度检查"
              continue
            fi
            age=$(( (now - epoch) / 86400 ))
            echo "${name}：数据生成于 $(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)，${age} 天前"
            if [ "${age}" -gt 7 ]; then
              echo "::warning::${name} 的数据已有 ${age} 天，上游 release 分支可能没在重建"
            fi
          done

      - name: Verify mmdb files
        run: |
          cd ./output/ || exit 1
          go install -v github.com/maxmind/mmdbverify@v1.1.0
          for name in $(ls *.mmdb); do
            $(go env GOPATH)/bin/mmdbverify -file ${name}
          done

      - name: Build db and metadb file
        run: |
          cd ./output/ || exit 1
          # 固定在下面的 commit 上，它等于 metacubex/geo 当前的 master（上游最后一次提交是
          # 2024-07-18，之后没再动过）。`@master` 是每次构建现解析的浮动目标，上游哪天推个
          # 新提交，转换器就跟着换了，.metadb / .db 的内容可能随之变化而这里毫不知情。
          # 换成 commit 之后，这次和下次构建用的是同一个二进制。升级时替换 SHA 即可：
          #   gh api repos/metacubex/geo/commits/master --jq .sha
          go install -trimpath -ldflags="-s -w -buildid=" github.com/metacubex/geo/cmd/geo@a4db326ccfd7e21276d5d05f4f7e512d14415553
          for file in $(ls *.dat | sed 's/\..*//'); do
            geo convert ip -i v2ray -o meta -f "./${file}.metadb" "./${file}.dat"
            geo convert ip -i v2ray -o sing -f "./${file}.db" "./${file}.dat"
          done

      - name: Move files
        run: |
          mkdir -p ./mihomo-geodata/ ./sing-box-geodata/
          cd ./output/ || exit 1
          for file in $(ls *.dat *.metadb); do
            install -Dp "./${file}" ../mihomo-geodata/
          done
          for file in $(ls *.db); do
            install -Dp "./${file}" ../sing-box-geodata/
          done

      - name: Move and generate files to branchs
        run: |
          mkdir -p ./tmp/
          mv -f ./output/Country*.mmdb ./mihomo-geodata/
          for file in $(ls ./output/clash/classical/ | sed 's/\..*//'); do
            cat "./output/clash/classical/${file}.txt" | perl -ne '/^\s*-\s+(.*)/ && print "$1\n"' > "./tmp/temp-${file}.list"
            sort --ignore-case "./tmp/temp-${file}.list" > "./ips/${file}ip.list"
          done

          grep '^IP-CIDR' ./ips/cnip.list | cut -d',' -f2 > ./ips/cnip.txt
          grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}' ./ips/cnip.txt | tee ./ips/cnip_ipv4.txt > ./ips/cn_ipv4.txt
          grep -Eio '([a-f0-9]{0,4}:){2,7}[a-f0-9]{0,4}/[0-9]{1,3}' ./ips/cnip.txt | tee ./ips/cnip_ipv6.txt > ./ips/cn_ipv6.txt
          
          # netflix / telegram 的 ASN 列表，两处都改过：
          # 一是抽取方式。上游写法是 `grep '"netflix":' config.json | grep -o 'AS[0-9]\+'`，
          # 抓整行再抽 AS 号，前提是数组必须写在一行里；config.json 一旦被格式化或手工折行，
          # 首行没 AS 号就抽出空文件（Sanity check 拦得住），首行留了一个 AS 号则静默只抽到
          # 那一条（拦不住）。改成用 awk 圈出数组范围，与写在一行还是几行无关。
          # 二是前缀。抽出来的 token 带 "AS"，而 mihomo 的 IP-ASN 规则把 payload 原样存下
          # （rules/common/ipasn.go 的 NewIPASN），匹配时与 LookupASN 返回的裸数字做字符串
          # 比较（component/mmdb/reader.go，字段是 uint32）——`IP-ASN,AS2906` 永远不等于
          # "2906"，这两份列表在 mihomo 里一直是死规则。剥掉前缀，与 cn-asn.list 对齐。
          for asnkey in netflix telegram; do
            awk -v key="${asnkey}" '$0 ~ "\"" key "\":" { inlist = 1 } inlist { print } inlist && /\]/ { exit }' ./config.json \
              | grep -o 'AS[0-9]\+' | sed 's/^AS/IP-ASN,/' | sort --ignore-case -u > "./ips/${asnkey}-asn.list"
          done

          # `ASN.China.list` 的行形如 `IP-ASN,4134`，数字后面没有逗号；原先的模式要求
          # 必须跟一个逗号，对它 5076 行全部匹配失败，而它正是本列表里量最大的一份。
          # ChinaASN 的 `IP-ASN,10111,no-resolve` 去掉尾逗号后输出不变。
          # 排序去重必须等两个源都读完：两源重叠 844 条，放在第一个源之后只会把第二份
          # 5076 行原样追加在有序结果尾部。curl 也从没有 pipefail 的管道头部挪了出来——
          # 这是一个 `bash -e` 的默认 shell，管道里失败的 curl 只会静默产出空列表。
          curl -fsSL --retry 3 --max-time 300 ${cn_asn} -o ./tmp/cn-asn.list
          curl -fsSL --retry 3 --max-time 300 ${cn_asn1} -o ./tmp/cn-asn1.list
          cat ./tmp/cn-asn.list ./tmp/cn-asn1.list | perl -ne '/^(IP-ASN,\d+)/ && print "$1\n"' | sort --ignore-case -u > ./ips/cn-asn.list

          rm -rf ./tmp* ./output*

      - name: Sanity check outputs
        run: |
          status=0
          for f in ./data/games ./data/media ./data/cn ./ips/* ./mihomo-geodata/* ./sing-box-geodata/*; do
            if [ ! -s "${f}" ]; then
              echo "::error::输出为空或缺失：${f}"
              status=1
            fi
          done
          [ "${status}" -eq 0 ] || exit 1
          wc -l ./data/games ./data/media ./data/cn ./ips/*.list
          ls -l ./mihomo-geodata/ ./sing-box-geodata/

          # 条目数守卫。只查「非空」拦不住上游源换格式造成的静默缩水（cn-asn 那次
          # 就是：列表里少了 5076 行，构建照样绿），而 cn 缩水的后果是这部分流量改走代理。
          # 拿上一次发布的列表比一比。取不到（首次运行、网络抖动）只警告，不判死构建。
          # 分两档：上千行的大表用 80%，几十行的小表用 50% —— 小表的绝对波动小，80% 那档
          # 会被正常增减打穿（gamesip 46 行，掉 10 条就是 22%）。
          # 不设「至少 N 行」这类绝对下限：ips 分支是 force-push 的，查不到历史发行版，
          # 拿不出有依据的 N，猜一个只会造出假失败。
          # cn_ipv4.txt 与 cnip_ipv4.txt、cn_ipv6.txt 与 cnip_ipv6.txt 是逐字节相同的别名
          # （blob SHA 相同），cnip.txt 是 cnip.list 的另一种格式、同一批条目 —— 都随
          # cnip.list 一起守住了，不必重复列。
          for spec in cnip.list:80 cn-asn.list:80 netflixip.list:80 mediaip.list:80 \
                      gamesip.list:50 privateip.list:50 telegramip.list:50 \
                      netflix-asn.list:50 telegram-asn.list:50; do
            name=${spec%%:*}
            pct=${spec##*:}
            # `--retry 3`：取不到就只是跳过守卫，一次网络抖动不该让守卫静默失效。
            if curl -fsSL --retry 3 --max-time 60 "https://raw.githubusercontent.com/${{ github.repository }}/ips/${name}" -o /tmp/previous.list; then
              previous=$(wc -l < /tmp/previous.list)
              current=$(wc -l < "./ips/${name}")
              floor=$(( previous * pct / 100 ))
              echo "${name}：上次 ${previous} 行 -> 本次 ${current} 行（下限 ${floor}，${pct}%）"
              if [ "${current}" -lt "${floor}" ]; then
                echo "::error::${name} 由 ${previous} 行掉到 ${current} 行，低于 ${pct}% 下限，很可能是某个上游源失效或格式变化"
                exit 1
              fi
            else
              echo "::warning::取不到已发布的 ${name}，跳过跌幅守卫"
            fi
          done

      - name: Release and upload `ips` assets
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ips
          tag: ips
          overwrite: true
          body: |
            供下游项目 [DustinWin/ruleset_geodata](https://github.com/DustinWin/ruleset_geodata) 使用的 IP 数据源文件
            [ShellCrash](https://github.com/juewuy/ShellCrash) 中 CN_IP 绕过内核所需文件
            文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./ips/*

      - name: Commit and push `ips` branch
        if: github.event_name != 'pull_request'
        run: |
          cd ./ips/ || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b ips
          git add . && git commit -m "IP 数据源文件和 CNIP 绕过内核文件更新于 ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin ips

      - name: Release and upload `mihomo-geodata` assets
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: mihomo-geodata
          tag: mihomo-geodata
          overwrite: true
          body: |
            [mihomo 内核](https://github.com/MetaCubeX/mihomo) geodata 文件
            geodata 文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./mihomo-geodata/*

      - name: Commit and push `mihomo-geodata` branch
        if: github.event_name != 'pull_request'
        run: |
          cd ./mihomo-geodata/ || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b mihomo-geodata
          git add . && git commit -m "mihomo 内核 geodata 文件更新于 ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin mihomo-geodata

      - name: Release and upload `sing-box-geodata` assets
        if: github.event_name != 'pull_request'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: sing-box-geodata
          tag: sing-box-geodata
          overwrite: true
          body: |
            [sing-box 内核](https://github.com/SagerNet/sing-box) geodata 文件
            geodata 文件更新于 ${{ env.update_version }}
          file_glob: true
          file: ./sing-box-geodata/*

      - name: Commit and push `sing-box-geodata` branch
        if: github.event_name != 'pull_request'
        run: |
          cd ./sing-box-geodata/ || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b sing-box-geodata
          git add . && git commit -m "sing-box 内核 geodata 文件更新于 ${update_version}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin sing-box-geodata

     

      - name: Purge jsDelivr CDN
        if: github.event_name != 'pull_request'
        run: |
          # 这一步是「通知 CDN 提前作废缓存」，纯属尽力而为：不作废的话 jsDelivr 过几分钟也会
          # 自己过期。所以它不该有判死构建的权力 —— 2026-10-02T05:30 那次就是这里
          # `curl: (35) Recv failure: Connection reset by peer` 把一次第 1-21 步全绿、三个分支
          # 都已推送成功的构建判成了红的，还连累后面 `Delete old workflow runs` 被 skip。
          # 三个目录加起来是 28 个顺序请求，每个都是一次瞬时故障的机会，所以既加
          # `--retry 3 --max-time 30`，也用 `||` 兜底：失败只警告。
          cd ./ips/ || exit 1
          for file in $(ls); do
            curl -i --retry 3 --max-time 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@ips/${file}" || echo "::warning::purge 失败：ips/${file}"
          done
          cd ../mihomo-geodata/ || exit 1
          for file in $(ls); do
            curl -i --retry 3 --max-time 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@mihomo-geodata/${file}" || echo "::warning::purge 失败：mihomo-geodata/${file}"
          done
          cd ../sing-box-geodata/ || exit 1
          for file in $(ls); do
            curl -i --retry 3 --max-time 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@sing-box-geodata/${file}" || echo "::warning::purge 失败：sing-box-geodata/${file}"
          done

      # 数据更新完主动通知 ruleset_geodata 重建，避免它 03:00 的定时跑在这批数据之前。
      # 只在成功构建里发（前序步骤失败时本步骤本就不会执行），且跳过 push / PR —— 那些是
      # 代码改动，不一定产出新数据。需要 secret DISPATCH_TOKEN（对 ruleset_geodata 有
      # Contents 读写，或 classic PAT 的 repo 权限）；没配置就只提示、不影响本仓库构建。
      - name: Notify `ruleset_geodata`
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::notice::未配置 DISPATCH_TOKEN，跳过通知 ruleset_geodata"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/panyichen48737/ruleset_geodata/dispatches" \
            -d '{"event_type":"data-updated"}'

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
